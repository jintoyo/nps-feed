name: NPS 지분공시 수집

on:
  schedule:
    # DART 공시는 장 마감 후 몰리므로 평일 19:10 KST (= 10:10 UTC)
    - cron: "10 10 * * 1-5"
  workflow_dispatch:        # 버튼으로 즉시 실행

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: 공시 수집
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NPS_DAYS: "14"
          NPS_THRESHOLD: "0.10"
        run: python collect.py

      - name: 변경분만 커밋
        run: |
          git config user.name  "nps-bot"
          git config user.email "nps-bot@users.noreply.github.com"
          git add nps-latest.json
          git diff --staged --quiet || git commit -m "공시 갱신 $(date -u +'%Y-%m-%d %H:%M')"
          git push
